<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Фотогалерея — Роза</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #F3F3F3;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 0;
            min-height: 100vh;
        }

        /* Только для ПК: курсор-лапка */
        @media (hover: hover) and (pointer: fine) {
            body {
                cursor: url('IconPaw.png') 12 5, auto;
            }
            body:active {
                cursor: url('CPaw.png') 12 5, auto;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: transparent;
            border-radius: 0;
            overflow: hidden;
        }

        /* Шапка с возвратом на главную */
        .back-header {
            padding: 1rem 2rem;
            background: #4A4A4A;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #FCF1F2;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            transition: 0.2s;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            background: rgba(255,255,255,0.1);
        }

        .back-link:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(-3px);
        }

        .back-link:active {
            transform: scale(0.97);
        }

        /* Заголовок страницы */
        .page-header {
            text-align: center;
            padding: 2rem 2rem 1rem 2rem;
            background: #F3F3F3;
        }

        .page-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #2c2c2c;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            font-family: 'Nunito', sans-serif;
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 0.5px;
        }

        /* Основной блок галереи — #4A4A4A с округлёнными углами */
        .gallery-main {
            background: #4A4A4A;
            border-radius: 1.5rem;
            margin: 1rem 2rem 2rem 2rem;
            padding: 2rem;
        }

        /* Сетка галереи */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .photo-card {
            background: #F3F3F3;
            border-radius: 1rem;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .photo-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .photo-card:active {
            transform: scale(0.98);
        }

        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: 0.3s;
        }

        .photo-card:hover img {
            filter: brightness(1.05);
        }

        /* Модальное окно для полноэкранного просмотра */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            cursor: pointer;
        }

        .modal-content {
            position: relative;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            padding: 2rem;
        }

        .modal-img {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 0.5rem;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #FCF1F2;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            z-index: 2001;
        }

        .close-modal:hover {
            color: #ccc;
            transform: scale(1.1);
        }

        /* Навигация вперед/назад */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: #FCF1F2;
            font-size: 2rem;
            padding: 1rem;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.3s;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2001;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-50%) scale(1.1);
        }

        .prev-btn {
            left: 20px;
        }

        .next-btn {
            right: 20px;
        }

        @media (max-width: 768px) {
            .back-header {
                padding: 1rem;
            }
            .page-title {
                font-size: 1.5rem;
            }
            .gallery-main {
                margin: 1rem;
                padding: 1rem;
            }
            .photo-grid {
                gap: 1rem;
            }
            .photo-card img {
                height: 180px;
            }
            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }
            .prev-btn {
                left: 10px;
            }
            .next-btn {
                right: 10px;
            }
            .close-modal {
                top: 10px;
                right: 20px;
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Шапка с кнопкой назад -->
    <div class="back-header">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> 
            Вернуться к Розе
        </a>
    </div>

    <!-- Заголовок страницы -->
    <div class="page-header">
        <h1 class="page-title">Все любят фотокарточки с котами</h1>
        <div class="page-subtitle">А если нет, то это их проблемы.</div>
    </div>

    <!-- Основной блок галереи -->
    <div class="gallery-main">
        <div class="photo-grid" id="photoGrid">
            <!-- Фото будут добавлены через JavaScript -->
        </div>
    </div>
</div>

<!-- Модальное окно для полноэкранного просмотра -->
<div id="modal" class="modal" onclick="closeModal()">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <div class="nav-btn prev-btn" onclick="event.stopPropagation(); navigate(-1)">&#10094;</div>
    <div class="nav-btn next-btn" onclick="event.stopPropagation(); navigate(1)">&#10095;</div>
    <div class="modal-content" onclick="event.stopPropagation()">
        <img class="modal-img" id="modalImg" src="" alt="">
    </div>
</div>

<script>
    // Список фотографий
    const photos = [
        "lies2.jpg",
        "on_chair.jpg",
        "on_couch.jpg",
        "on_shelf.jpg",
        "outdoors.jpg",
        "paws_up.jpg",
        "stays.jpg",
        "with_mars.jpg"
    ];

    let currentIndex = 0;

    // Функция для генерации сетки галереи
    function renderGallery() {
        const grid = document.getElementById('photoGrid');
        grid.innerHTML = '';
        
        photos.forEach((photo, index) => {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.onclick = () => openModal(index);
            
            const img = document.createElement('img');
            img.src = photo;
            img.alt = 'Фото Розы';
            img.onerror = function() {
                this.src = 'https://placehold.co/400x300?text=Фото+не+найдено';
                this.style.objectFit = 'contain';
            };
            
            card.appendChild(img);
            grid.appendChild(card);
        });
    }

    // Открыть модальное окно
    function openModal(index) {
        currentIndex = index;
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        
        modal.style.display = 'block';
        modalImg.src = photos[currentIndex];
        
        modalImg.onerror = function() {
            this.src = 'https://placehold.co/800x600?text=Фото+не+найдено';
        };
        
        document.body.style.overflow = 'hidden';
    }

    // Закрыть модальное окно
    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    // Навигация
    function navigate(direction) {
        let newIndex = currentIndex + direction;
        if (newIndex < 0) newIndex = photos.length - 1;
        if (newIndex >= photos.length) newIndex = 0;
        
        currentIndex = newIndex;
        const modalImg = document.getElementById('modalImg');
        modalImg.src = photos[currentIndex];
        
        modalImg.onerror = function() {
            this.src = 'https://placehold.co/800x600?text=Фото+не+найдено';
        };
    }

    // Обработка клавиш навигации
    document.addEventListener('keydown', function(e) {
        const modal = document.getElementById('modal');
        if (modal.style.display === 'block') {
            if (e.key === 'ArrowLeft') {
                navigate(-1);
            } else if (e.key === 'ArrowRight') {
                navigate(1);
            } else if (e.key === 'Escape') {
                closeModal();
            }
        }
    });

    // Запускаем отрисовку галереи
    renderGallery();
</script>

</body>
</html>
